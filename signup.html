<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup Form Test</title>
</head>
<body>

  <h2>Signup Form Test</h2>

  <form id="signupForm">
    <label for="email">Email:</label><br />
    <input type="email" id="email" name="email" required><br /><br />

    <label for="password">Password:</label><br />
    <input type="password" id="password" name="password" required><br /><br />

    <label for="repassword">Re-enter Password:</label><br />
    <input type="password" id="repassword" name="repassword" required><br /><br />

    <input type="submit" value="Sign Up">
  </form>
<br><br>
  <div id="testResults"></div> <!-- This will display the test results -->

  <script src="signup.js"></script> <!-- Link to signup.js -->
  <script src="test.js"></script>   <!-- Link to test.js -->

</body>
</html>
